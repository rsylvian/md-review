name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      # `prepare` runs here, so dist/ is built before the e2e specs look for it.
      - run: yarn install --frozen-lockfile

      - run: yarn typecheck

      - run: yarn test:coverage

      # The runner has no Google Chrome, so use Playwright's own chromium.
      - run: npx playwright install --with-deps chromium
      - run: yarn test:e2e
        env:
          MD_REVIEW_CHANNEL: bundled

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
