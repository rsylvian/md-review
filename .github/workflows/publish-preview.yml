name: Publish preview

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: publish-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-preview:
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          registry-url: 'https://registry.npmjs.org'

      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test

      # .nvmrc's bundled npm may predate OIDC trusted-publishing support (needs >=11.5.1).
      - run: npm install -g npm@^11.5.1

      - name: Set prerelease version
        id: version
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          BASE_VERSION=$(node -p "require('./package.json').version")
          PRE_VERSION="${BASE_VERSION}-pr${PR_NUM}.${SHORT_SHA}"
          npm version "$PRE_VERSION" --no-git-tag-version --allow-same-version
          echo "version=$PRE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=pr-${PR_NUM}" >> "$GITHUB_OUTPUT"

      - run: yarn build

      - name: Publish preview
        run: npm publish --tag "${{ steps.version.outputs.tag }}" --provenance

      - name: Comment install command on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- md-review-preview-comment -->';
            const body = [
              marker,
              `Preview published: \`${{ steps.version.outputs.version }}\``,
              '```',
              `npx @rsylvian/md-review@${{ steps.version.outputs.tag }}`,
              '```',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
