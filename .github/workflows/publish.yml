name: Publish package

on:
  pull_request:
    types: [labeled, synchronize]
  push:
    branches: [main]

# actions/setup-node's registry-url always writes an .npmrc referencing
# ${NODE_AUTH_TOKEN}, even though publishing here goes through OIDC trusted
# publishing and never reads it. Without this, yarn's env interpolation
# blows up on the undefined var before any of our steps run.
env:
  NODE_AUTH_TOKEN: ''

jobs:
  publish-preview:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    concurrency:
      group: publish-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          registry-url: 'https://registry.npmjs.org'

      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test

      # .nvmrc's bundled npm may predate OIDC trusted-publishing support (needs >=11.5.1).
      - run: npm install -g npm@^11.5.1

      - name: Set prerelease version
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          BASE_VERSION=$(node -p "require('./package.json').version")
          VERSION="${BASE_VERSION}-pr${{ github.event.pull_request.number }}.${SHORT_SHA}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: yarn build
      - run: npm publish --tag "pr-${{ github.event.pull_request.number }}" --provenance

  comment-preview:
    needs: publish-preview
    if: github.event_name == 'pull_request' && needs.publish-preview.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment install command on PR
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- md-review-preview-comment -->';
            const body = [
              marker,
              `Preview published: \`${{ needs.publish-preview.outputs.version }}\``,
              '```',
              `npx @rsylvian/md-review@pr-${{ github.event.pull_request.number }}`,
              '```',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node

  publish-release:
    needs: release-please
    if: github.event_name == 'push' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
          registry-url: 'https://registry.npmjs.org'

      - run: yarn install --frozen-lockfile
      - run: npm install -g npm@^11.5.1
      - run: yarn build
      - run: npm publish --tag latest --provenance
